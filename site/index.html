<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rivals Randomizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Marvel Rivals Team Randomizer</h1>
    <div class="buttons">
      <button id="roll">Randomize</button>
      <button id="clear">Clear</button>
    </div>
  </header>
  <main>
    <section id="teams"></section>
    <p class="hint">
      Set role counts per team (team size is the sum). Click a portrait to ban a hero from the pool;
      1 / 2 pins them to a team.
    </p>
    <section id="grid"></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
