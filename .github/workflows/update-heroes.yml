name: Update hero data

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: curl -sSL https://www.marvelrivals.com/heroes -o /tmp/heroes.html
      - uses: actions/upload-artifact@v4
        with:
          name: heroes-html
          path: /tmp/heroes.html
      - run: node scripts/update.ts
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: site/
          commit-message: "chore(data): refresh hero data"
          branch: ci/update-heroes
          title: "chore(data): refresh hero data"
          body: Automated weekly hero data refresh from `scripts/update.ts`.
